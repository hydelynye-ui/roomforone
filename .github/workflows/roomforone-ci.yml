name: roomforone verification

on:
  push:
    branches:
      - feature/roomforone-henry-incremental
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional
      - name: TypeScript check
        run: npm run typecheck
      - name: Core tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Preserve production build for review
        uses: actions/upload-artifact@v4
        with:
          name: roomforone-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
